version: "2"

run:
  timeout: 10m

linters:
  default: standard
  enable:
    # Correctness
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck

    # Security. gosec matters here: this server brokers credentials and reads
    # untrusted cluster data, so the whole threat model in docs/design leans on
    # it being enforced rather than advisory.
    - gosec

    # Clarity. The project owner is learning Go, and these steer toward the
    # idiomatic form rather than a Java-shaped one.
    - copyloopvar
    - dupl
    - goconst
    - gocritic
    - intrange
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    exhaustive:
      # Gardener enums (conditions, error codes, operations) are switched on in
      # the rule engine. A missing case there is a silently wrong diagnosis.
      default-signifies-exhaustive: true

    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        - hugeParam # triggers constantly on k8s API structs, which are large by design

    govet:
      enable-all: true
      disable:
        - fieldalignment # readability of API structs beats a few bytes of padding

    nolintlint:
      require-explanation: true
      require-specific: true

    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
        - name: package-comments

  exclusions:
    rules:
      # Tests may hardcode fixtures and repeat themselves; that is what makes
      # golden-file tests readable.
      - path: _test\.go
        linters: [dupl, goconst, gosec, unparam]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gmyilma/gardener-mcp-server
